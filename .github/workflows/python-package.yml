# Enforces the repository's documented verification baseline (see CHANGELOG.md)
# and runs the regression tests under the Python 3.9 floor and a current Python.

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install tools
      run: python -m pip install pytest ruff==0.16.6
    - name: Lint with Ruff
      run: ruff check Python3 --no-cache --select F,E9,B904,B007,S113,S324
    - name: Compile every tracked Python file
      run: git ls-files -z '*.py' | xargs -0 python -W error::SyntaxWarning -m py_compile
    - name: Test with pytest
      run: python -m pytest

  shell:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # The sourced dotfiles have no .sh extension. One syntax error stops bash
    # from defining every function after it.
    - name: Check Bash syntax
      run: git ls-files -z '*.sh' '*/.bashrc' '*/.bash_functions' '*/.bash_aliases' | xargs -0 -n 1 bash -n
    - name: ShellCheck errors
      run: git ls-files -z '*.sh' | xargs -0 shellcheck -S error
